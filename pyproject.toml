[project]
name = "sam-outbound"
version = "0.1.0"
description = "Outbound tooling for SAM Technology: hiring-signal prospecting into Instantly, and Instantly-to-HubSpot sync."
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sam-outbound = "sam_outbound.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sam_outbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
